{% extends "base.html" %}
{% block title %}Record Intervention{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:650px;">
  <h1 class="h3">Record intervention</h1>
  <p class="text-muted">Record the support response for {{ view.prediction.household.name }}.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save intervention</button></form>
</div>
{% endblock %}
