name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install flake8 black
      - name: flake8
        run: flake8 --exclude=migrations,venv,staticfiles,media .
      - name: black --check
        run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-test-only-secret-key"
      FIELD_ENCRYPTION_KEY: "ceF-JKmeZatL9k-mjhDLdiMCzQshNz6cbe0sKdKikd4="
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report
      - name: Django deployment checks
        run: python manage.py check --deploy
        continue-on-error: true  # informational for dev .env; not a merge blocker

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t foodrisk-app:ci .
