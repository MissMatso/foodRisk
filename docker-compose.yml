services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-foodrisk}
      POSTGRES_USER: ${DB_USER:-foodrisk_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-foodrisk_user} -d ${DB_NAME:-foodrisk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_NAME: ${DB_NAME:-foodrisk}
      DB_USER: ${DB_USER:-foodrisk_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn foodrisk_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  postgres_data:
